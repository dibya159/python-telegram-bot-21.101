
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dosto ka Chat</title>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0f1115; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 12px 16px; background: #171a21; border-bottom: 1px solid #262a33; display: flex; justify-content: space-between; align-items: center; }
        .chat-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .message { background: #262a33; padding: 8px 12px; border-radius: 6px; max-width: 70%; word-break: break-word; }
        footer { padding: 12px; background: #171a21; display: flex; gap: 8px; border-top: 1px solid #262a33; }
        input, button { padding: 10px; border-radius: 6px; border: 1px solid #3d4451; background: #262a33; color: #fff; }
        input { flex: 1; }
        button { background: #4f46e5; border: none; cursor: pointer; }
        
        /* Admin Panel Styles */
        #admin-panel { display: none; padding: 20px; background: #1b1f28; flex: 1; overflow-y: auto; }
        .admin-card { background: #262a33; padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <header>
        <div id="app-title">Dosto ka Chat</div>
        <div id="nav-controls">
            <button id="admin-toggle-btn" style="display:none;">Admin Panel</button>
            <button id="logout-btn">Logout</button>
        </div>
    </header>
    <!-- Chat View -->
    <div id="chat-view" style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
        <div id="chat-messages" class="chat-container"></div>
        <footer>
            <input type="text" id="message-input" placeholder="Message likho...">
            <button id="send-btn">Send</button>
        </footer>
    </div>
    <!-- Admin Panel View (Hidden by default) -->
    <div id="admin-panel">
        <h2>Admin Dashboard</h2>
        <h3>Users List</h3>
        <div id="admin-users-list">Loading users...</div>
    </div>
    <script type="module">
        import { initializeApp } from "
https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js
";
        import { getAuth, onAuthStateChanged, signOut } from "
https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js
";
        import { getDatabase, ref, push, onValue, update } from "
https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js
";
        const firebaseConfig = {
            databaseURL: "
https://dosto-ka-chat-default-rtdb.firebaseio.com/
"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const ADMIN_UID = "OOdUaKRzd3CEoELyWIrJXvSGl3";
        let isAdminView = false;
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Check if current user is admin
                if (user.uid === ADMIN_UID) {
                    document.getElementById('admin-toggle-btn').style.display = "inline-block";
                    loadAdminData();
                } else {
                    document.getElementById('admin-toggle-btn').style.display = "none";
                }
                loadMessages();
            } else {
                // Agar user logged in nahi hai toh login page par redirect karein
                window.location.href = "login.html";
            }
        });
        // Event Listeners for Buttons (Taaki click properly kaam kare)
        document.getElementById('admin-toggle-btn').addEventListener('click', () => {
            isAdminView = !isAdminView;
            const chatView = document.getElementById('chat-view');
            const adminPanel = document.getElementById('admin-panel');
            const toggleBtn = document.getElementById('admin-toggle-btn');
            if (isAdminView) {
                chatView.style.display = "none";
                adminPanel.style.display = "block";
                toggleBtn.textContent = "Back to Chat";
            } else {
                chatView.style.display = "flex";
                adminPanel.style.display = "none";
                toggleBtn.textContent = "Admin Panel";
            }
        });
        document.getElementById('send-btn').addEventListener('click', () => {
            const input = document.getElementById('message-input');
            if (!input.value.trim()) return;
            push(ref(db, 'messages'), {
                text: input.value,
                name: auth.currentUser.email || 'User',
                timestamp: Date.now()
            });
            input.value = "";
        });
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            }).catch((error) => {
                console.error("Logout error:", error);
            });
        });
        function loadMessages() {
            const msgRef = ref(db, 'messages');
            onValue(msgRef, (snapshot) => {
                const container = document.getElementById('chat-messages');
                container.innerHTML = "";
                const data = snapshot.val() || {};
                for (const id in data) {
                    const msg = data[id];
                    const div = document.createElement('div');
                    div.className = "message";
                    div.textContent = `${msg.name || 'User'}: ${msg.text}`;
                    container.appendChild(div);
                }
                container.scrollTop = container.scrollHeight;
            });
        }
        function loadAdminData() {
            const usersRef = ref(db, 'users');
            onValue(usersRef, (snapshot) => {
                const list = document.getElementById('admin-users-list');
                list.innerHTML = "";
                const data = snapshot.val() || {};
                for (const [uid, name] of Object.entries(data)) {
                    const card = document.createElement('div');
                    card.className = "admin-card";
                    card.innerHTML = `
                        <span>${name} (UID: ${uid})</span>
                        <button class="ban-btn" data-uid="${uid}" style="background:#ef4444;">Ban</button>
                    `;
                    list.appendChild(card);
                }
                // Ban buttons listener
                document.querySelectorAll('.ban-btn').forEach(button => {
                    button.addEventListener('click', async (e) => {
                        const targetUid = e.target.getAttribute('data-uid');
                        await update(ref(db, 'users/' + targetUid), { status: 'banned' });
                        alert('User banned successfully!');
                    });
                });
            });
        }
    </script>
</body>
</html>
